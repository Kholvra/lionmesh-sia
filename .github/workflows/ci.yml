name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # Version comes from package.json `packageManager`; specifying it twice fails.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrasi
        run: pnpm check:migrations
      - name: Versi seed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "[verify:seed] tidak ada base perbandingan; pemeriksaan versi seed dilewati."
            exit 0
          fi
          if git diff --name-only "$base" HEAD -- supabase/seeds supabase/seed.sql | grep -q .; then
            if ! git diff --name-only "$base" HEAD -- supabase/seed-version | grep -q .; then
              echo "[verify:seed] Isi seed berubah tanpa perubahan supabase/seed-version. Naikkan versi dataset seed."
              exit 1
            fi
          fi
          echo "[verify:seed] versi seed mengikuti perubahan isi seed."

      - name: Lint
        run: pnpm lint

      - name: Tipe
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Batas modul
        run: pnpm arch:check

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
